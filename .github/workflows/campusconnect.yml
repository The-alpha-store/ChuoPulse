name: ChuoPulse build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "supabase/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      variant:
        description: Which APK variant to build
        type: choice
        options: [staging, debug]
        default: staging
      lint:
        description: Also run Android lint (slower)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chuopulse-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

# ---------------------------------------------------------------------------
# build — runs on every push to main/master and on workflow_dispatch
#         Builds all 4 role apps in parallel via a matrix.
# ---------------------------------------------------------------------------
jobs:
  build:
    name: Build ${{ matrix.app }} APK
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false          # let other apps finish even if one fails
      matrix:
        include:
          - app: app-owner
            label: Owner
          - app: app-admin
            label: Admin
          - app: app-lecturer
            label: Lecturer
          - app: app-student
            label: Student

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          # Cache is scoped per matrix entry so each app gets its own cache slot
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check Supabase secrets are set
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Lint — ${{ matrix.label }} (optional)
        if: ${{ inputs.lint }}
        continue-on-error: true
        run: gradle --no-daemon :${{ matrix.app }}:lintDebug --stacktrace

      - name: Build APK — ${{ matrix.label }}
        env:
          VARIANT: ${{ inputs.variant || 'staging' }}
        run: |
          if [ "$VARIANT" = "debug" ]; then task=assembleDebug; else task=assembleStaging; fi
          gradle --no-daemon ":${{ matrix.app }}:$task" --stacktrace

      - name: Upload APK — ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-${{ matrix.label }}-${{ inputs.variant || 'staging' }}-apk
          path: ${{ matrix.app }}/build/outputs/apk/${{ inputs.variant || 'staging' }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping file — ${{ matrix.label }}
        if: ${{ (inputs.variant || 'staging') == 'staging' }}
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-${{ matrix.label }}-mapping
          path: ${{ matrix.app }}/build/outputs/mapping/staging/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload lint report — ${{ matrix.label }}
        if: ${{ always() && inputs.lint }}
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-${{ matrix.label }}-lint-report
          path: ${{ matrix.app }}/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

# ---------------------------------------------------------------------------
# release — runs only when a version tag (v*) is pushed.
#           Signs and publishes all 4 apps in a matrix, then creates one
#           GitHub Release containing all APKs, AABs and mapping files.
# ---------------------------------------------------------------------------
  release:
    name: Signed release — ${{ matrix.label }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app-owner
            label: Owner
          - app: app-admin
            label: Admin
          - app: app-lecturer
            label: Lecturer
          - app: app-student
            label: Student

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"
          # debug keystore is still needed for non-release build types referenced by the config
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build signed APK & AAB — ${{ matrix.label }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle --no-daemon \
            :${{ matrix.app }}:assembleRelease \
            :${{ matrix.app }}:bundleRelease \
            --stacktrace

      - name: Upload release artifacts — ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: chuopulse-${{ matrix.label }}-release-artifacts
          path: |
            ${{ matrix.app }}/build/outputs/bundle/release/*.aab
            ${{ matrix.app }}/build/outputs/apk/release/*.apk
            ${{ matrix.app }}/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  # After ALL 4 apps are built and uploaded, create one GitHub Release
  publish-release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: chuopulse-*-release-artifacts
          merge-multiple: true
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true
          name: "ChuoPulse ${{ github.ref_name }}"
          body: |
            ## Apps in this release

            | App | Package |
            |-----|---------|
            | 👑 Owner | `com.willykez.campconnect.owner` |
            | 🛡️ Admin | `com.willykez.campconnect.admin` |
            | 📚 Lecturer | `com.willykez.campconnect.lecturer` |
            | 🎓 Student | `com.willykez.campconnect.student` |
