name: ChuoPulse build and deployment

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_database:
        description: Deploy pending Supabase migrations to production after checks
        required: false
        type: boolean
        default: false
      function_name:
        description: Optional Supabase Edge Function to deploy
        required: false
        type: choice
        options:
          - none
          - campus-wipe-files
        default: none

permissions:
  contents: read

concurrency:
  group: chuopulse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android lint and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run Android lint
        id: android_lint
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APK
        id: android_apk
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusconnect-android-reports
          path: |
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campusconnect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      # Fail the Android job only after all checks and reports have run.
      - name: Check Android job results
        if: always()
        env:
          LINT_RESULT: ${{ steps.android_lint.outcome }}
          APK_RESULT: ${{ steps.android_apk.outcome }}
        run: |
          echo "Android lint: $LINT_RESULT"
          echo "Debug APK: $APK_RESULT"

          failed=0

          for result in "$LINT_RESULT" "$APK_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more Android checks failed. See the uploaded reports."
            exit 1
          fi

          echo "All Android checks passed."

  migration_changes:
    name: Detect production database changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      database: ${{ steps.filter.outputs.database }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'supabase/migrations/**'
              - 'supabase/config.toml'

  deploy_database:
    name: Deploy Supabase migrations to production
    needs: [android, migration_changes]

    if: >-
      always() &&
      needs.android.result == 'success' &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.migration_changes.outputs.database == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy_database == true
        )
      )

    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    concurrency:
      group: chuopulse-production-database
      cancel-in-progress: false

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production secrets
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing"
              exit 1
            fi
          done

      - name: Link hosted project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Preview migration changes
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

  deploy_function:
    name: Deploy selected Supabase Edge Function
    needs: [android]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.function_name != 'none' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }

          test -n "$SUPABASE_PROJECT_ID" || {
            echo "::error::SUPABASE_PROJECT_ID is missing"
            exit 1
          }

      - name: Deploy selected function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_ID"

  release_android:
    name: Build and publish signed Android release

    if: startsWith(github.ref, 'refs/tags/v')

    needs: [android]

    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing"
              exit 1
            fi
          done

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.p12"

          if [ ! -s "$RUNNER_TEMP/upload-key.p12" ]; then
            echo "::error::The upload keystore is empty or invalid"
            exit 1
          fi

          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"

      - name: Create temporary debug keystore required for Gradle configuration
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build signed release APK and bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Publish GitHub release for version tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
