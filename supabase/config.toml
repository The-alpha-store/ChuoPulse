# Supabase CLI configuration for local development and CI.
# Hosted-project settings (dashboard) must match: see the "Auth settings" section in docs/BACKEND.md.
project_id = "campusconnect"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "campusconnect://login-callback"
additional_redirect_urls = ["campusconnect://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = ""   # length only; no forced symbols or digits

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true      # the six-digit email code proves the email is theirs
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# Second step. Administrators must complete it (the database checks aal2).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30
